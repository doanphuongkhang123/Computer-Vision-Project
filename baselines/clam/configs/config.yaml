seed: 1027

train_csv: data/train.csv
val_csv: data/val.csv
test_csv: data/test.csv

results_dir: results/clam
wandb: false
wandb_project: bracs_wsi_classification
wandb_run_name: clam
wandb_api_key: ""
wandb_api_key_file: wandb_api_key.txt

num_classes: 3
class_names: [Benign, Atypical, Malignant]
hidden_size: 1536
model: clam

max_patches: null
eval_max_patches: null
train_sampling: random
eval_sampling: uniform
normalize_features: true

batch_size: 1
num_workers: 4
grad_accum_steps: 4

baseline_dim: 512
baseline_attn_dim: 256
baseline_dropout: 0.25
clam_variant: mb
clam_gated: true
clam_k_sample: 8
clam_instance_eval: true
clam_subtyping: true
clam_bag_weight: 0.7

lr: 0.00005
min_lr: 0.000005
weight_decay: 0.0001
max_epochs: 100
patience: 20
label_smoothing: 0.0
class_weighting: inverse_sqrt
balanced_sampler: false
sampler_weighting: inverse_sqrt
selection_metric: f1_macro
scheduler: plateau
scheduler_factor: 0.5
scheduler_patience: 5

amp: true
grad_clip: 1.0
